name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact commit or release tag to publish (also used for rollback)'
        required: false
        type: string
      expected_sha:
        description: 'Optional full SHA that the ref must resolve to'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check synchronized version
        run: npm run version:check

      - name: Check minimum text size
        run: npm run styles:check

      - name: Template text check
        run: npm run i18n:check

      - name: Format check (RPG modules)
        run: npm run format:check

      - name: Type-check application and tests
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production for browser QA
        run: |
          node tools/write-build-info.mjs
          npm run build -- --configuration production

      - name: Browser tests
        env:
          PLAYWRIGHT_PRODUCTION: '1'
        run: npm run test:e2e

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  # Functional check of the @cross tests in Firefox and WebKit. Advisory: engine-specific hiccups are
  # reported in the run but never hold back a deployment that passed the Chromium quality gate.
  cross-browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Build production for browser QA
        run: |
          node tools/write-build-info.mjs
          npm run build -- --configuration production

      - name: Browser tests in WebKit
        env:
          PLAYWRIGHT_PRODUCTION: '1'
          PLAYWRIGHT_CROSS_BROWSER: '1'
        run: npx playwright test --project webkit

      # Headless Firefox on Linux gets no WebGL context at all; a virtual display gives it Mesa's software GL.
      - name: Browser tests in Firefox
        if: always()
        env:
          PLAYWRIGHT_PRODUCTION: '1'
          PLAYWRIGHT_CROSS_BROWSER: '1'
        run: xvfb-run -a npx playwright test --project firefox --headed

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: |
          node tools/write-build-info.mjs
          npm run build -- --configuration production --base-href /pitch-legends/

      - name: SPA fallback (404.html)
        run: cp dist/pitch-legends/browser/index.html dist/pitch-legends/browser/404.html

      - name: Archive Pages artifact
        run: >-
          tar --dereference --hard-dereference
          --directory dist/pitch-legends/browser
          -cvf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git
          --exclude=.github
          .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 30
          if-no-files-found: error

      - name: Preserve versioned release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pitch-legends-${{ github.run_id }}
          path: dist/pitch-legends/browser
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
